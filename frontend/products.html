<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Products | KeerthiStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="store-page" data-page="products">
    <header class="store-header">
        <nav class="store-nav" aria-label="Main navigation">
            <a class="store-brand" href="index.html">Keerthi<span>Store</span></a>
            <div class="store-nav-links">
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
                <a href="orders.html" data-auth-link hidden>My orders</a>
                <a href="admin.html" data-admin-link hidden>Manage store</a>
                <a href="dashboard.html" data-auth-link hidden>Account</a>
                <a href="#" data-logout-button data-auth-link hidden>Log out</a>
                <a href="login.html" data-guest-link>Login</a>
                <a href="register.html" data-guest-link>Register</a>
            </div>
        </nav>
    </header>
    <main class="store-container">
        <section class="store-page-heading">
            <p class="store-kicker">THE KEERTHISTORE COLLECTION</p>
            <h1>Find something you'll love.</h1>
            <p>Thoughtful everyday finds, selected for you.</p>
        </section>
        <section class="catalog-toolbar" aria-label="Product filters">
            <label class="catalog-search">
                <span class="sr-only">Search products</span>
                <input id="product-search" type="search" placeholder="Search products..." autocomplete="off">
            </label>
            <label>
                <span class="sr-only">Filter by category</span>
                <select id="category-filter"><option value="">All categories</option></select>
            </label>
            <label>
                <span class="sr-only">Sort products</span>
                <select id="product-sort">
                    <option value="newest">Recently added</option>
                    <option value="price-asc">Price: low to high</option>
                    <option value="price-desc">Price: high to low</option>
                </select>
            </label>
        </section>
        <p id="products-message" class="store-message" role="status" aria-live="polite"></p>
        <section id="product-grid" class="product-grid" aria-label="Products"></section>
    </main>
    <script src="store.js" defer></script>
</body>
</html>
