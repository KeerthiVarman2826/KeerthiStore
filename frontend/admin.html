<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Administration | KeerthiStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="store-page" data-page="admin">
    <header class="store-header">
        <nav class="store-nav" aria-label="Main navigation">
            <a class="store-brand" href="index.html">Keerthi<span>Store</span></a>
            <div class="store-nav-links">
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
                <a href="orders.html" data-auth-link hidden>My orders</a>
                <a href="admin.html" data-admin-link hidden>Manage store</a>
                <a href="dashboard.html" data-auth-link hidden>Account</a>
                <a href="#" data-logout-button data-auth-link hidden>Log out</a>
                <a href="login.html" data-guest-link>Login</a>
                <a href="register.html" data-guest-link>Register</a>
            </div>
        </nav>
    </header>
    <main class="store-container">
        <section class="store-page-heading compact-heading"><p class="store-kicker">ADMINISTRATION</p><h1>Manage your store</h1></section>
        <p id="admin-message" class="store-message" role="status" aria-live="polite"></p>
        <section class="admin-layout">
            <form id="admin-product-form" class="store-form">
                <h2 id="admin-form-title">Add a product</h2>
                <input type="hidden" name="productId">
                <label>Product name<input name="name" maxlength="120" required></label>
                <label>Description<textarea name="description" rows="4" maxlength="3000" required></textarea></label>
                <div class="form-grid">
                    <label>Price<input name="price" type="number" min="0.01" step="0.01" required></label>
                    <label>Stock<input name="stock" type="number" min="0" step="1" required></label>
                    <label>Category<input name="category" maxlength="80" required></label>
                    <label>Image URL or path<input name="image" maxlength="500" placeholder="images/product-placeholder.svg"></label>
                </div>
                <div class="admin-form-actions"><button class="primary-button" type="submit">Save product</button><button class="secondary-button" id="admin-cancel-edit" type="button" hidden>Cancel edit</button></div>
            </form>
            <section class="admin-products-section"><h2>Products</h2><div id="admin-products" class="admin-list"></div></section>
        </section>
        <section class="admin-orders-section"><h2>Manage orders</h2><div id="admin-orders" class="admin-list"></div></section>
    </main>
    <script src="store.js" defer></script>
</body>
</html>
