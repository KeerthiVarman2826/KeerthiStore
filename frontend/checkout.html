<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | KeerthiStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="store-page" data-page="checkout">
    <header class="store-header">
        <nav class="store-nav" aria-label="Main navigation">
            <a class="store-brand" href="index.html">Keerthi<span>Store</span></a>
            <div class="store-nav-links">
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
                <a href="orders.html" data-auth-link hidden>My orders</a>
                <a href="admin.html" data-admin-link hidden>Manage store</a>
                <a href="dashboard.html" data-auth-link hidden>Account</a>
                <a href="#" data-logout-button data-auth-link hidden>Log out</a>
                <a href="login.html" data-guest-link>Login</a>
                <a href="register.html" data-guest-link>Register</a>
            </div>
        </nav>
    </header>
    <main class="store-container">
        <section class="store-page-heading compact-heading">
            <p class="store-kicker">ALMOST YOURS</p><h1>Checkout</h1><p>Enter your delivery details to place your order.</p>
        </section>
        <p id="checkout-message" class="store-message" role="status" aria-live="polite"></p>
        <div class="checkout-layout">
            <form id="checkout-form" class="store-form">
                <h2>Delivery information</h2>
                <div class="form-grid">
                    <label>Full name<input name="name" autocomplete="name" maxlength="120" required></label>
                    <label>Email address<input name="email" type="email" autocomplete="email" maxlength="254" required></label>
                    <label>Phone number<input name="phone" type="tel" autocomplete="tel" minlength="7" maxlength="30" required></label>
                    <label>PIN code<input name="pinCode" autocomplete="postal-code" minlength="3" maxlength="20" required></label>
                    <label class="form-grid-wide">Delivery address<input name="address" autocomplete="street-address" maxlength="300" required></label>
                    <label>City<input name="city" autocomplete="address-level2" maxlength="100" required></label>
                    <label>State<input name="state" autocomplete="address-level1" maxlength="100" required></label>
                </div>
                <button class="primary-button" type="submit">Place order</button>
            </form>
            <aside class="summary-card"><h2>Your order</h2><div id="checkout-summary"></div><div class="summary-line summary-total"><span>Total</span><strong id="checkout-total">₹0.00</strong></div></aside>
        </div>
    </main>
    <script src="store.js" defer></script>
</body>
</html>
